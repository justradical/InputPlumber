# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Schema version number
version: 2

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: Retroid Type 1

# Unique identifier of the capability mapping
id: ret1

# List of mapped events
mapping:
  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: Quick Access Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_BACK
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: Right Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_C
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_Z
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_LEFT
          value_type: button
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_RIGHT
          value_type: button
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_DOWN
          value_type: button
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_UP
          value_type: button
    target_event:
      gamepad:
        button: DPadUp

# List of events to filter from the source devices
filtered_events: []
